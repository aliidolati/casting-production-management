name: Backend tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and H2 integration tests
        run: bash scripts/test-backend.sh fast

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: MySQL integration and migration regressions
        run: bash scripts/test-backend.sh mysql
      # Raw application/test logs can contain synthetic credentials or snapshots.
      # Keep summaries in the job log; never upload backups, uploads or full target/.

  drawing-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix target/browser-tools --no-audit --no-fund playwright@1.56.1
          target/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: JavaScript regressions and tracking archive browser smoke
        run: |
          node --test src/test/js/*.test.cjs
          NODE_PATH="$PWD/target/browser-tools/node_modules" node src/test/js/tracking-archive.browser.cjs
      - name: Drawing and deletion browser smoke test
        run: NODE_PATH="$PWD/target/browser-tools/node_modules" bash mvnw -B -ntp -Ddrawing.browser.enabled=true -Dtest=DrawingBrowserSmokeTest test
