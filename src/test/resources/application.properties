# تنظیمات فقط برای تست؛ هیچ ارتباطی با دیتابیس MySQL واقعی ندارد.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=8f1c2e6a9b7d4f0e3c5a8b2d6f9e1c4a7b0d3f6e9c2a5b8d1f4e7c0a3b6d9f2e
app.jwt.expiration-ms=86400000
app.bootstrap-admin.password=synthetic-tests-only-password

app.upload.dir=./target/test-uploads

# job یادآوری در تست‌ها خودکار اجرا نشود (تست‌ها مستقیم صدایش می‌زنند)
app.tasks.reminders.enabled=false
