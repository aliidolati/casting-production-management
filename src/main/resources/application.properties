spring.application.name=ProductManager

# Server Configuration
# ============================
server.port=8080

# ============================
# MySQL Database Connection
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# Flyway (مدیریت نسخه‌دار اسکیما)
# ============================
# این تنظیمات به‌تنهایی اجرای Flyway را تضمین نمی‌کنند؛ ماژول Boot آن فعلاً نصب نیست.
# زنجیره SQL کامل نیست؛ پیش از فعال‌سازی، DATABASE_STRUCTURE.md را بررسی کنید.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema created by Hibernate ddl-auto

# ============================
# JPA / Hibernate Configuration
# ============================
# فعلاً update می‌ماند تا اگر جایی بین baseline و Entity اختلاف جزئی بود، Hibernate
# آن را جبران کند. بعد از اینکه اجرای Flyway روی دیتابیس واقعی تایید شد، به validate تغییر می‌کند.
spring.jpa.hibernate.ddl-auto=update
# لاگ SQL در کنسول (مخصوصاً کنسول ویندوز) خیلی کند است و روی سیستم‌های ضعیف زمان پاسخ را چند برابر می‌کند.
# برای دیباگ موقت true کنید.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================
# JWT
# ============================
# Supply a stable signing key through private runtime configuration. Never commit it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ============================
# Tasks (وظایف)
# ============================
# یادآوری مهلت (امروز/فردا/گذشته) برای مسئول وظایف باز؛ هر یادآوری برای هر مهلت فقط یک بار ساخته می‌شود.
app.tasks.reminders.enabled=true
app.tasks.reminders.cron=0 */30 * * * *

# ============================
# Tensile trend report (گزارش روند تست کشش)
# ============================
# اگر تغییر کل خط روند در بازه (درصد از میانگین) کمتر از این باشد، روند «ثابت» اعلام می‌شود.
app.tensile-trend.stable-threshold-percent=2.0
# بازنویسی آستانه برای هر پارامتر (اختیاری)، مثلاً:
# app.tensile-trend.stable-threshold-percent-by-parameter.EL=5.0
# R² برابر یا بیشتر از strong-r2: اطمینان بالا؛ از moderate-r2: متوسط؛ کمتر: پایین
app.tensile-trend.strong-r2=0.7
app.tensile-trend.moderate-r2=0.4
# با داده‌ی کمتر از این تعداد، اطمینان به روند بالا/متوسط اعلام نمی‌شود
app.tensile-trend.min-reliable-points=5
# شناسایی داده‌ی پرت (فقط علامت‌گذاری، حذف نمی‌شود)
app.tensile-trend.outlier-min-points=5
app.tensile-trend.outlier-modified-z=3.5
# سقف تعداد نمونه در هر اجرای گزارش و پنجره‌ی پیش‌فرض میانگین متحرک
app.tensile-trend.max-points=5000
app.tensile-trend.default-moving-average-window=3

# ============================
# File uploads (piece definition 2D drawings)
# ============================
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ============================
# Performance
# ============================
# فشرده‌سازی پاسخ‌های JSON / JS / CSS / HTML (پاسخ‌های کمتر از ۱ کیلوبایت فشرده نمی‌شوند)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript

# فایل‌های ثابتِ بدون پارامتر نسخه (مثل index.html) هر بار اعتبارسنجی شوند تا نسخه‌ی جدید فوراً دیده شود.
# کش بلندمدت js/css/fonts در StaticResourceCacheConfig تنظیم شده است.
spring.web.resources.cache.cachecontrol.no-cache=true
